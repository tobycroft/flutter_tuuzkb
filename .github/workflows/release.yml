  name: Flutter Android Release

  on:
    push:
      tags:
        - 'v*.*.*'

    workflow_dispatch:

  permissions:
    contents: write

  jobs:
    build:
      name: Build Flutter Android
      runs-on: ubuntu-latest

      steps:
        # --------------------------------------------------
        # 1. Checkout
        # --------------------------------------------------
        - name: Checkout
          uses: actions/checkout@v4

        # --------------------------------------------------
        # 2. Setup Java / JDK
        # --------------------------------------------------
        # Flutter Android / Gradle 编译需要 JDK。
        # 如果你的项目使用较新的 Android Gradle Plugin，
        # 推荐 JDK 17。
        - name: Setup JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '17'
            cache: gradle

        # --------------------------------------------------
        # 3. Setup Flutter
        # --------------------------------------------------
        - name: Setup Flutter
          uses: subosito/flutter-action@v2
          with:
            channel: stable
            cache: true

        # --------------------------------------------------
        # 4. Flutter 环境检查
        # --------------------------------------------------
        - name: Flutter Doctor
          run: flutter doctor -v

        # --------------------------------------------------
        # 5. Check Android Gradle Wrapper
        # --------------------------------------------------
        - name: Check Gradle Wrapper
          shell: bash
          run: |
            set -e
            
            if [ ! -f "android/gradlew" ]; then
              echo "::error::android/gradlew is missing."
              echo
              echo "Your Flutter Android project must contain:"
              echo "  android/gradlew"
              echo "  android/gradlew.bat"
              echo "  android/gradle/wrapper/gradle-wrapper.jar"
              echo "  android/gradle/wrapper/gradle-wrapper.properties"
              exit 1
            fi
            
            chmod +x android/gradlew
            
            echo "Gradle wrapper:"
            cd android
            ./gradlew --version

        # --------------------------------------------------
        # 6. Flutter dependencies
        # --------------------------------------------------
        - name: Get Flutter dependencies
          run: flutter pub get

        # --------------------------------------------------
        # 7. Analyze
        # --------------------------------------------------
        - name: Flutter Analyze
          run: flutter analyze

        # --------------------------------------------------
        # 8. Build APK
        # --------------------------------------------------
        - name: Build APK
          run: |
            flutter build apk --release

        # --------------------------------------------------
        # 9. Build Android App Bundle
        # --------------------------------------------------
        - name: Build AAB
          run: |
            flutter build appbundle --release

        # --------------------------------------------------
        # 10. Rename artifacts
        # --------------------------------------------------
        - name: Prepare Release Files
          shell: bash
          run: |
            set -e
            
            mkdir -p release
            
            cp build/app/outputs/flutter-apk/app-release.apk \
               release/app-release.apk
            
            cp build/app/outputs/bundle/release/app-release.aab \
               release/app-release.aab
            
            echo "Release files:"
            ls -lh release/

        # --------------------------------------------------
        # 11. Upload artifacts
        # --------------------------------------------------
        - name: Upload APK Artifact
          uses: actions/upload-artifact@v4
          with:
            name: flutter-android-apk
            path: release/app-release.apk

        - name: Upload AAB Artifact
          uses: actions/upload-artifact@v4
          with:
            name: flutter-android-aab
            path: release/app-release.aab

        # --------------------------------------------------
        # 12. Create GitHub Release
        # --------------------------------------------------
        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v2
          with:
            files: |
              release/app-release.apk
              release/app-release.aab
            generate_release_notes: true
            draft: false
            prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}