name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Downgrade deps for CI (Dart 3.6.0)
        run: |
          sed -i 's/flutter_lints: ^6.0.0/flutter_lints: ^5.0.0/' pubspec.yaml
          sed -i 's/package_info_plus: ^10.0.0/package_info_plus: ^9.0.1/' pubspec.yaml

      - name: Downgrade AGP and Kotlin for CI (Flutter 3.27.0)
        run: |
          sed -i 's/id("com.android.application") version "9.1.0"/id("com.android.application") version "8.13.0"/' android/settings.gradle.kts
          sed -i 's/id("org.jetbrains.kotlin.android") version "2.4.0"/id("org.jetbrains.kotlin.android") version "2.2.20"/' android/settings.gradle.kts

      - name: Downgrade Gradle for CI (Flutter 3.27.0)
        run: |
          sed -i 's|gradle-9.3.1-all.zip|gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/flutter_tuuzkb-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_tuuzkb-release
          path: release/flutter_tuuzkb-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/flutter_tuuzkb-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto commit APK
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/flutter_tuuzkb-release.apk
          git diff --staged --quiet || git commit -m "chore: auto build APK [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}