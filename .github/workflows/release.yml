name: Flutter Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' 

      # 4. 获取依赖包
      - name: Install dependencies
        run: flutter pub get

      # 5. 构建 Android APK
      - name: Build APK
        run: flutter build apk --release
        
      # 6. 上传 APK 提供下载（新增步骤）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk # 下载时显示的压缩包名称
          path: build/app/outputs/flutter-apk/app-release.apk # Flutter 默认的 APK 输出路径