name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Java
      # AGP 8.13 requires JDK 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # Flutter
      # ------------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      # ------------------------------------------------------------
      # Show build environment
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo
          echo "===== Dart ====="
          dart --version

          echo
          echo "===== Java ====="
          java -version

          echo
          echo "===== Gradle Wrapper ====="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          echo
          echo "===== Android Gradle Plugin / Kotlin ====="
          grep -E \
            'com.android.application|org.jetbrains.kotlin.android' \
            android/settings.gradle.kts || true

      # ------------------------------------------------------------
      # Make sure Gradle version matches AGP 8.13
      #
      # AGP 8.13 requires Gradle 8.13.
      #
      # We modify ONLY the wrapper version.
      # We do NOT downgrade AGP/Kotlin in CI.
      # ------------------------------------------------------------
      - name: Configure Gradle 8.13
        working-directory: android
        run: |
          ./gradlew wrapper --gradle-version 8.13 --distribution-type all

          echo
          echo "Gradle wrapper configured:"
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # ------------------------------------------------------------
      # Verify Gradle
      # ------------------------------------------------------------
      - name: Verify Gradle
        working-directory: android
        run: ./gradlew --version

      # ------------------------------------------------------------
      # Flutter clean
      # ------------------------------------------------------------
      - name: Clean
        run: flutter clean

      # ------------------------------------------------------------
      # Get dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # Static analysis
      # ------------------------------------------------------------
      - name: Analyze
        run: flutter analyze

      # ------------------------------------------------------------
      # Build release APK
      # ------------------------------------------------------------
      - name: Build APK
        run: flutter build apk --release

      # ------------------------------------------------------------
      # Prepare release directory
      # ------------------------------------------------------------
      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/flutter_tuuzkb-release.apk

          ls -lh release/flutter_tuuzkb-release.apk

      # ------------------------------------------------------------
      # Upload GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter_tuuzkb-release
          path: release/flutter_tuuzkb-release.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # GitHub Release
      #
      # Only runs when pushing a v* tag.
      # Example:
      #
      #   git tag v1.0.0
      #   git push origin v1.0.0
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/flutter_tuuzkb-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ------------------------------------------------------------
      # Commit APK back to main
      #
      # Only runs for normal pushes to main.
      # ------------------------------------------------------------
      - name: Commit APK to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add release/flutter_tuuzkb-release.apk

          if git diff --cached --quiet; then
            echo "APK has not changed. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: auto build APK [skip ci]"
          git push origin HEAD:main