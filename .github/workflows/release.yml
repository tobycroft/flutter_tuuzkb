name: Flutter Build

# 触发条件：当代码 push 到 main 分支，或者提 PR 到 main 分支时触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    # 运行环境：最新版的 Ubuntu 服务器
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Java 环境（Android 打包必须）
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 配置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # 使用稳定版 Flutter

      # 4. 获取依赖包
      - name: Install dependencies
        run: flutter pub get

      # 5. 构建 Android APK
      - name: Build APK
        run: flutter build apk --release